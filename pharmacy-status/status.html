<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดตามสถานะยาค้างจ่าย</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#293047;--muted:#6e788d;--purple:#5d2589}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef1f8;font-family:Sarabun,Tahoma,sans-serif;color:var(--ink)}.hero{position:relative;z-index:0;padding:30px 24px 82px;background:linear-gradient(145deg,#291054,#6d2a9b);color:#fff}.hero-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:24px}.hero-logo{flex:none;width:82px;height:82px;object-fit:contain;filter:drop-shadow(0 3px 6px #16052f66)}.tag{display:inline-block;border:1px solid #ffffff4c;border-radius:999px;padding:6px 12px;font-size:14px}.hero h1{margin:8px 0 5px;font-size:34px;line-height:1.12}.hero p{margin:0;color:#e6daf3}.content{position:relative;z-index:1;width:min(520px,calc(100% - 32px));margin:-54px auto 30px}.panel,.card{background:#fff;border-radius:23px;box-shadow:0 13px 30px #26104c24}.panel{display:flex;gap:14px;padding:18px;border:1px solid #e1d5c4}.symbol{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:15px;background:#fff0c7;color:#926000;font-size:24px}.panel strong{display:block;font-size:20px;line-height:1.28}.panel span{display:block;color:var(--muted);font-size:13px}.panel p{margin:4px 0 0;color:#5f6879;line-height:1.4}.waiting .symbol{background:#fff0c7;color:#926000}.ready .symbol{background:#d9f5e8;color:#087656}.delivery .symbol{background:#dcecff;color:#175b9d}.received .symbol{background:#e8e9ef;color:#414657}.card{margin-top:16px;padding:18px}.head{display:flex;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid #e7e8ee;color:#667085;font-size:14px}.code{font-size:12px;color:#896a9b}.row{padding:15px 0;border-bottom:1px dashed #d9dce5}.row:last-of-type{border:0}.row small{display:block;color:#7a8291;margin-bottom:3px}.row b{font-size:18px}.amount{display:inline-block;padding:4px 10px;border-radius:9px;background:#fce8ea;color:#a1333d}.note{margin-top:12px;padding:14px;border:1px solid #ef9ca5;border-radius:14px;background:#fff0f1;color:#b42332;line-height:1.5}.note span{display:block;margin-bottom:3px;font-size:13px;font-weight:700}.note b{display:block;color:#b42332;font-size:16px;font-weight:700}.error{padding:20px;text-align:center}.error h2{margin:0 0 8px}.loading{color:#e9e0f7}
    .panel.waiting{background:#fffaf0;border-color:#f3c66a}.panel.waiting strong{color:#8a5b00}.panel.ready{background:#f2fcf7;border-color:#8fd7b3}.panel.ready strong{color:#087656}.panel.delivery{background:#f1f7ff;border-color:#9fc7f2}.panel.delivery strong{color:#175b9d}.panel.received{background:#f6f7fa;border-color:#d4d8e3}.panel.received strong{color:#414657}.panel.cancelled{background:#fff3f4;border-color:#f0b5ba}.panel.cancelled strong{color:#a1323d}.contact{margin-top:12px;padding:13px;border-radius:14px;background:#f0f4fc;color:#334f7e;font-weight:600;line-height:1.45}.track-card{margin-top:16px;padding:18px 18px 8px;border-radius:22px;background:#fff;box-shadow:0 11px 28px #16063f18}.track-title{display:flex;justify-content:space-between;gap:12px;padding-bottom:15px;border-bottom:1px solid #e8e9ef}.track-title strong{font-size:18px}.track-title span{color:#776389;font-size:12px}.timeline{padding:16px 0 0}.track-row{display:grid;grid-template-columns:70px 24px 1fr;gap:10px;min-height:78px}.track-time{padding-top:1px;color:#9ba0ac;font-size:11px;line-height:1.35;text-align:right}.track-axis{position:relative;display:flex;justify-content:center}.track-axis:after{content:"";position:absolute;top:17px;bottom:-2px;width:2px;background:#dcdfe7}.track-row:last-child .track-axis:after{display:none}.track-dot{position:relative;z-index:1;width:13px;height:13px;margin-top:3px;border:3px solid #c8ccd5;border-radius:50%;background:#fff}.track-copy{padding-bottom:18px;color:#a0a4ae}.track-copy b{display:block;font-size:16px;line-height:1.35}.track-copy small{display:block;margin-top:4px;line-height:1.4}.track-row.done .track-dot{border-color:#8150a6;background:#8150a6}.track-row.done .track-copy{color:#71687b}.track-row.current .track-dot{width:17px;height:17px;margin-top:1px;border-color:#5d2589;background:#fff;box-shadow:0 0 0 5px #eee3f7}.track-row.current .track-copy{color:#3f195f}.track-row.current .track-copy b{font-size:18px}.track-row.current .track-time{color:#5d2589;font-weight:700}.track-row.cancelled .track-dot{border-color:#bd3c49;background:#bd3c49}.track-row.cancelled .track-copy{color:#9f2632}@media(max-width:390px){.track-row{grid-template-columns:56px 20px 1fr;gap:8px}.track-copy b{font-size:15px}}
  </style>
</head>
<body>
  <header class="hero"><div class="hero-title"><h1>ติดตามสถานะ<br>ยาค้างจ่าย</h1><img class="hero-logo" src="../logo.png" alt="ตราโรงพยาบาลมหาวิทยาลัยพะเยา"></div><p>ตรวจสอบสถานะรายการของคุณ</p></header>
  <main class="content" id="content"><p class="loading">กำลังตรวจสอบสถานะ…</p></main>
  <script>
    const $ = id => document.getElementById(id);
    const q = new URLSearchParams(location.search), token = q.get('token'), api = q.get('api') || 'https://script.google.com/macros/s/AKfycbzkTF08dH_w6FU8CixUThwO25fDZ9n2SI6XMqTJqnWbSeo-gTFpsVy9JYdDqRDdPmS51A/exec';
    const safe = value => String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const masked = name => ((name || 'ผู้รับบริการ').trim().split(/\s+/)[0] || 'ผู้รับบริการ') + ' XXX';
    const date = value => value ? new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'long',year:'numeric'}).format(new Date(value + 'T00:00:00')) : '-';
    const updated = value => value ? new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)) : '-';
    const meta = {waiting:['◷','อยู่ระหว่างการจัดหา/ยายังไม่มา','รายการยายังไม่มา โปรดตรวจสอบใหม่ภายหลัง'],ready:['✓','ยามาแล้ว โปรดนำเอกสารมาติดต่อรับยา','กรุณานำเอกสารมาติดต่อรับยา'],delivery:['↗','จัดส่งยาให้ผู้ป่วยแล้ว','ห้องยาได้จัดส่งยาให้ผู้ป่วยแล้ว โปรดเตรียมชำระเงินค่าส่งยา 55 บาท (เก็บปลายทาง)'],received:['✓','รับยาแล้ว','ผู้ป่วยได้รับยาเรียบร้อยแล้ว'],cancelled:['!','ยกเลิกรายการ','กรุณาติดต่อห้องยาเพื่อสอบถามข้อมูลเพิ่มเติม']};
    function fail(message){$('content').innerHTML='<section class="card error"><h2>ไม่พบรายการ</h2><p>'+safe(message)+'</p></section>';}
    function timeline(item){
      const steps=[['waiting','อยู่ระหว่างการจัดหา/ยายังไม่มา','ห้องยากำลังดำเนินการจัดหารายการยา'],['ready','ยามาแล้ว พร้อมติดต่อรับยา','โปรดนำเอกสารมาติดต่อรับยา'],['delivery','จัดส่งยาให้ผู้ป่วยแล้ว','โปรดเตรียมชำระค่าจัดส่ง 55 บาท แบบเก็บปลายทาง'],['received','รับยาแล้ว','ดำเนินการรับยาเรียบร้อยแล้ว']];
      if(item.status==='cancelled')return '<section class="track-card"><div class="track-title"><strong>ลำดับสถานะยา</strong><span>อัปเดตล่าสุด</span></div><div class="timeline"><div class="track-row current cancelled"><time class="track-time">'+updated(item.updatedAt)+'</time><div class="track-axis"><i class="track-dot"></i></div><div class="track-copy"><b>ยกเลิกรายการ</b><small>กรุณาติดต่อเจ้าหน้าที่เพื่อสอบถามรายละเอียด</small></div></div></div></section>';
      const current=Math.max(0,steps.findIndex(step=>step[0]===item.status));
      const history=Array.isArray(item.statusHistory)?item.statusHistory:[];
      const when=status=>{if(status===item.status)return updated(item.updatedAt);const hit=[...history].reverse().find(entry=>entry&&entry.status===status);return hit&&hit.at?updated(hit.at):'';};
      return '<section class="track-card"><div class="track-title"><strong>ลำดับสถานะยา</strong><span>รหัส '+safe(item.id)+'</span></div><div class="timeline">'+steps.map((step,index)=>'<div class="track-row '+(index<current?'done':index===current?'current':'pending')+'"><time class="track-time">'+(when(step[0])||'รอดำเนินการ')+'</time><div class="track-axis"><i class="track-dot"></i></div><div class="track-copy"><b>'+step[1]+'</b><small>'+step[2]+'</small></div></div>').join('')+'</div></section>';
    }
    if(!token){fail('QR นี้เป็นรูปแบบเดิม กรุณาขอใบแจ้งฉบับใหม่จากห้องยา');}
    else fetch(api + '?action=pharmacyPatient&token=' + encodeURIComponent(token) + '&_=' + Date.now(),{cache:'no-store'}).then(r => r.json()).then(data => {
      if(!data.ok) throw new Error('ไม่พบข้อมูล หรือรายการถูกยกเลิก');
      const item=data.item, state=meta[item.status] || meta.waiting;
      $('content').innerHTML='<section class="panel '+safe(item.status)+'"><div class="symbol">'+state[0]+'</div><div><span>สถานะล่าสุด</span><strong>'+state[1]+'</strong><p>'+state[2]+'</p></div></section>'+timeline(item)+'<section class="card"><div class="head"><span>รายละเอียดรายการ</span><span class="code">รหัส '+safe(item.id)+'</span></div><div class="row"><small>ผู้รับบริการ</small><b>'+safe(masked(item.patient))+'</b></div><div class="row"><small>รายการยา</small><b>'+safe(item.drug || 'อยู่ระหว่างระบุรายการ')+'</b></div><div class="row"><small>จำนวนค้างจ่าย</small><b class="amount">'+safe(item.quantity || '-')+'</b></div><div class="row"><small>รับได้หลังวันที่</small><b>'+date(item.availableDate)+'</b></div><div class="row"><small>อัปเดตสถานะล่าสุด</small><b>'+updated(item.updatedAt)+'</b></div>'+(item.note?'<div class="note"><span>หมายเหตุสำหรับผู้ป่วย</span><b>'+safe(item.note)+'</b></div>':'')+'<div class="contact">หากมีข้อสงสัย โทร 054-466-666 ต่อ 7121, 7123, 7408</div></section>';
    }).catch(() => fail('กรุณาลองใหม่ภายหลัง หรือติดต่อห้องยา'));
  </script>
</body>
</html>
